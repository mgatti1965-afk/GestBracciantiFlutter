<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="50%" stop-color="#143c2c"/>
      <stop offset="100%" stop-color="#1b4d3e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#52b788" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Maestranze (Squadra di 3 figure con orologio presenze) -->
  <g filter="url(#shadow)">
    <!-- Figura sinistra -->
    <circle cx="160" cy="180" r="42" fill="#a7d7c5"/>
    <path d="M 95,290 C 95,230 130,225 160,225 C 190,225 225,230 225,290 Z" fill="#a7d7c5" opacity="0.8"/>
    
    <!-- Figura destra -->
    <circle cx="352" cy="180" r="42" fill="#a7d7c5"/>
    <path d="M 287,290 C 287,230 322,225 352,225 C 382,225 417,230 417,290 Z" fill="#a7d7c5" opacity="0.8"/>
    
    <!-- Figura centrale (Caposquadra / Responsabile) -->
    <circle cx="256" cy="140" r="52" fill="#ffffff"/>
    <path d="M 180,270 C 180,200 220,195 256,195 C 292,195 332,200 332,270 Z" fill="#ffffff"/>

    <!-- Orologio / Quadrante Ore Lavoro in primo piano -->
    <circle cx="256" cy="355" r="95" fill="#0b1e16" stroke="url(#goldGrad)" stroke-width="14"/>
    <!-- Tacche orarie -->
    <circle cx="256" cy="275" r="5" fill="#fda085"/>
    <circle cx="256" cy="435" r="5" fill="#fda085"/>
    <circle cx="176" cy="355" r="5" fill="#fda085"/>
    <circle cx="336" cy="355" r="5" fill="#fda085"/>
    <!-- Lancette -->
    <line x1="256" y1="355" x2="256" y2="295" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="256" y1="355" x2="305" y2="355" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="256" cy="355" r="9" fill="#fda085"/>
  </g>
</svg>
