<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081c15" />
      <stop offset="50%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a1" />
      <stop offset="50%" stop-color="#f4a261" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#b7e4c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#52b788" stroke-width="3" stroke-opacity="0.3" />

  <!-- Agricultural Motif: Spiga di Grano / Germoglio / Orologio Lavoro -->
  <g filter="url(#shadow)" transform="translate(256, 240)">
    <!-- Stelo Centrale -->
    <path d="M 0,165 Q -5,60 0,-130" fill="none" stroke="#faedcd" stroke-width="12" stroke-linecap="round" />

    <!-- Spighe e Foglie (Coppie Alternate) -->
    <!-- Coppia 1 (in cima) -->
    <path d="M 0,-130 C -25,-180 0,-200 0,-200 C 0,-200 25,-180 0,-130 Z" fill="url(#goldGrad)" />

    <!-- Coppia 2 -->
    <path d="M -4,-90 C -55,-120 -60,-155 -30,-165 C -5,-155 -2,-115 -4,-90 Z" fill="url(#goldGrad)" />
    <path d="M 4,-90 C 55,-120 60,-155 30,-165 C 5,-155 2,-115 4,-90 Z" fill="url(#goldGrad)" />

    <!-- Coppia 3 -->
    <path d="M -5,-35 C -65,-60 -75,-100 -40,-115 C -10,-100 -4,-60 -5,-35 Z" fill="url(#goldGrad)" />
    <path d="M 5,-35 C 65,-60 75,-100 40,-115 C 10,-100 4,-60 5,-35 Z" fill="url(#goldGrad)" />

    <!-- Coppia 4 (Foglie grandi verdi alla base) -->
    <path d="M -6,30 C -85,15 -105,-30 -70,-55 C -30,-40 -5,5 -6,30 Z" fill="url(#leafGrad)" />
    <path d="M 6,30 C 85,15 105,-30 70,-55 C 30,-40 5,5 6,30 Z" fill="url(#leafGrad)" />

    <!-- Coppia 5 (Foglie inferiori estese) -->
    <path d="M -5,95 C -115,80 -135,10 -85,-10 C -45,15 -5,65 -5,95 Z" fill="url(#leafGrad)" />
    <path d="M 5,95 C 115,80 135,10 85,-10 C 45,15 5,65 5,95 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Cerchio / Ghiera orario di lavoro (sottile arco dorato alla base) -->
  <path d="M 120,380 A 150,150 0 0,0 392,380" fill="none" stroke="#f4a261" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 12" opacity="0.85" />
  
  <!-- Lettere GB stilizzate in basso -->
  <text x="256" y="445" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#faedcd" letter-spacing="6" text-anchor="middle">GESTBRACCIANTI</text>
</svg>
